[project]
name = "fraud-lakehouse"
version = "0.1.0"
description = "Lakehouse de détection de fraude bancaire (PaySim) : Spark, Delta Lake, MLflow, Airflow"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rim Hamdoune" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "delta-spark==4.1.*",
    "pyspark==4.1.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
